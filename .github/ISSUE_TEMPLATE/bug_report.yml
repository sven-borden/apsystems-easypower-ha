name: Bug Report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for taking the time to report a bug!"

  - type: input
    attributes:
      label: Integration version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    attributes:
      label: Home Assistant version
      placeholder: "e.g. 2025.3.0"
    validations:
      required: true

  - type: input
    attributes:
      label: Inverter model
      placeholder: "e.g. EZ1-M-EU 600W"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the bug
      placeholder: "What happened? What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    attributes:
      label: Relevant log output
      description: "Enable debug logging and paste the output here."
      render: text
      placeholder: |
        logger:
          logs:
            custom_components.apsystems_easypower: debug
